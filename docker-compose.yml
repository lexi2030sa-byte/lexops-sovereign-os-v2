version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lexops-postgres-2026
    environment:
      POSTGRES_DB: lexops_sovereign_db
      POSTGRES_USER: lexops_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PLACEHOLDER:-lexops_secret_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/0001_c9_ledger_block_zero.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexops_admin -d lexops_sovereign_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexops-app-2026
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://lexops_admin:${POSTGRES_PASSWORD_PLACEHOLDER:-lexops_secret_dev_pass}@db:5432/lexops_sovereign_db
      - GEMINI_API_KEY=${GEMINI_API_KEY_SECRET_REF}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID_SECRET_REF}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET_SECRET_REF}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN_SECRET_REF}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
